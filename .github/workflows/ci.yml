name: Aegis internal preview checks
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: aegis-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            gateway/go.sum
            controller/go.sum
            alpha/go.sum
            tests/integration/scannerchannel/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make test
      - name: Install pinned test browser
        working-directory: console
        run: npx playwright install --with-deps chromium
      - name: Verify scanner console in browser
        working-directory: console
        run: npm run test:browser
      - run: make research-build
      - run: python3 scripts/source_manifest.py
  trusted-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f deploy/compose.demo.yaml build
      - run: docker compose -f deploy/compose.demo.yaml up -d
      - name: Wait for local demo liveness
        run: |
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:7410/api/v1/health/live',timeout=2).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Aegis demo did not start')
          PY
      - run: python3 tests/integration/demo_acceptance.py
      - run: python3 tests/integration/scoped_jobs_acceptance.py
      - run: python3 tests/integration/repository_acceptance.py
      - run: python3 tests/integration/scanner_owner_api_acceptance.py
      - run: python3 tests/integration/scanner_verifier_enrollment_acceptance.py
      - name: Verify owner retained finding catalogue
        env:
          AEGIS_LIVE_CATALOGUE_TEST: '1'
        run: python3 tests/integration/finding_catalogue_acceptance.py
      - name: Verify owner finding history refusal boundaries
        env:
          AEGIS_LIVE_FINDING_HISTORY_TEST: '1'
        run: python3 tests/integration/finding_history_acceptance.py
      - name: Verify private packaged database snapshot
        env:
          AEGIS_LIVE_SNAPSHOT_TEST: '1'
        run: python3 tests/integration/database_snapshot_packaged_acceptance.py
      - name: Prove isolated application recovery after database loss
        env:
          AEGIS_RECOVERY_DRILL: '1'
        run: python3 tests/integration/recovery_application_acceptance.py
      - name: Stop only this disposable CI demo
        if: always()
        run: docker compose -f deploy/compose.demo.yaml down

  packaged-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: alpha/go.sum
      - run: make research-build engine-authz-build engine-relay-build
      - name: Prepare checksum-pinned engine for this disposable job
        run: |
          mkdir -m 700 "$RUNNER_TEMP/aegis-ci-engine-parent"
          python3 scripts/ci_engine.py "$RUNNER_TEMP/aegis-ci-engine-parent/engine"
          echo "AEGIS_CI_ENGINE_ROOT=$RUNNER_TEMP/aegis-ci-engine-parent/engine" >> "$GITHUB_ENV"
      - name: Start isolated job engine with the required SDK API
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo env PATH="$AEGIS_CI_ENGINE_ROOT/bin:$PATH" "$AEGIS_CI_ENGINE_ROOT/bin/dockerd" --host=unix:///var/run/docker.sock --data-root="$AEGIS_CI_ENGINE_ROOT/data" --exec-root="$AEGIS_CI_ENGINE_ROOT/exec" --pidfile="$AEGIS_CI_ENGINE_ROOT/dockerd.pid" > "$AEGIS_CI_ENGINE_ROOT/daemon.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if DOCKER_API_VERSION=1.55 "$AEGIS_CI_ENGINE_ROOT/bin/docker" info > /dev/null 2>&1; then
              echo "$AEGIS_CI_ENGINE_ROOT/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 1
          done
          tail -80 "$AEGIS_CI_ENGINE_ROOT/daemon.log"
          exit 1
      - run: docker compose -f deploy/compose.demo.yaml build
      - run: docker build -f alpha/Dockerfile -t aegis-community/scanner-worker:0.1.0-alpha.1 .
      - run: docker build -f alpha/Dockerfile --target scanner-broker -t aegis-community/scanner-broker:0.1.0-alpha.1 .
      - run: docker build -f alpha/Dockerfile --target scanner-dispatch -t aegis-community/scanner-dispatch:0.1.0-alpha.1 .
      - run: docker build -f alpha/Dockerfile --target scanner-authorizer -t aegis-community/scanner-authorizer:0.1.0-alpha.1 .
      - run: cd alpha && CGO_ENABLED=0 go test -c -o ../bin/aegis-engine-gate-tests ./engineauthz
      - name: Preload the exact public Bandit image
        run: |
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          tool=next(t for t in json.loads(pathlib.Path('tools/scanners.lock.json').read_text())['tools'] if t['id']=='bandit')
          assert re.fullmatch(r'ghcr.io/pycqa/bandit/bandit@sha256:[0-9a-f]{64}',tool['image'])
          subprocess.run(['docker','pull',tool['image']],check=True)
          PY
      - name: Verify packaged UID/socket worker and held cleanup admission
        env:
          AEGIS_PACKAGED_WORKER_TEST: '1'
        run: python3 tests/integration/packaged_worker_acceptance.py
      - name: Verify selected broker and isolated dispatch client
        env:
          AEGIS_PACKAGED_WORKER_TEST: '1'
          AEGIS_PACKAGED_BROKER_TEST: '1'
        run: python3 tests/integration/packaged_worker_acceptance.py
      - name: Verify packaged selected broker through restricted TLS engine
        env:
          AEGIS_PACKAGED_WORKER_TEST: '1'
          AEGIS_PACKAGED_BROKER_TEST: '1'
          AEGIS_PACKAGED_ENGINE_AUTHZ_TEST: '1'
        run: python3 tests/integration/packaged_worker_acceptance.py
      - name: Verify packaged controller-observed authorizer and held cleanup admission
        env:
          AEGIS_PACKAGED_WORKER_TEST: '1'
          AEGIS_PACKAGED_BROKER_TEST: '1'
          AEGIS_PACKAGED_ENGINE_AUTHZ_TEST: '1'
          AEGIS_PACKAGED_CONTROLLER_GATE_TEST: '1'
        run: python3 tests/integration/packaged_worker_acceptance.py
      - name: Stop only this disposable job engine
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          root=os.environ.get('AEGIS_CI_ENGINE_ROOT')
          if root:
              pid=pathlib.Path(root)/'dockerd.pid'
              if pid.is_file():
                  value=pid.read_text().strip()
                  if re.fullmatch(r'[1-9][0-9]*',value):
                      subprocess.run(['sudo','kill','-TERM',value],check=False)
          PY

  isolated-engine-authz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: alpha/go.sum
      - name: Prepare checksum-pinned additional daemon
        run: |
          mkdir -m 700 "$RUNNER_TEMP/aegis-authz-engine-parent"
          python3 scripts/ci_engine.py "$RUNNER_TEMP/aegis-authz-engine-parent/engine"
          echo "AEGIS_CI_ENGINE_ROOT=$RUNNER_TEMP/aegis-authz-engine-parent/engine" >> "$GITHUB_ENV"
      - run: make research-build engine-authz-build
      - name: Verify native daemon authorization with real guarded Bandit
        env:
          AEGIS_REAL_ENGINE_AUTHZ_TEST: '1'
        run: python3 tests/integration/engine_authz_acceptance.py
