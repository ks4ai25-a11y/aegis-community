# Explicit durable admission for a separately provisioned scanner daemon.
# Requires local authorizer enrollment/selection and original protocol2 namespace.
# No independent cleanup release is enabled by this overlay.
services:
  scanner-authorizer:
    profiles: [operator-engine-admission]
    image: aegis-community/scanner-authorizer:0.1.0-alpha.1
    build: {context: .., dockerfile: alpha/Dockerfile, target: scanner-authorizer}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
    stop_grace_period: 10s
    command: [serve-admitted, "${AEGIS_SCANNER_AUTHORIZER_ROOT:?Provision private authorizer state}/authz.sock", "${AEGIS_SCANNER_AUTHORIZER_ROOT}/bound-journal", "${AEGIS_SCANNER_ENGINE_DIGEST:?Set approved engine digest}", "${AEGIS_SCANNER_REGISTRY_ROOT:?Set canonical registry path}", "10001", "10001", /opt/aegis/tools/scanners.lock.json, /run/scanner/worker.sock, /run/authorizer-credential/authorizer.credential, "${AEGIS_SCANNER_OWNER:?Set enrolled owner}", "${AEGIS_SCANNER_AUTHORIZER_ID:?Set selected authorizer identity}", "${AEGIS_SCANNER_REGISTRY_DIGEST:?Set approved registry digest}", "${AEGIS_SCANNER_REGISTRY_NAMESPACE:?Set approved original protocol2 namespace}", "${AEGIS_SCANNER_RULES_DIGEST:--}"]
    volumes:
      - {type: volume, source: scanner_socket, target: /run/scanner, read_only: true}
      - {type: volume, source: scanner_admission_credentials, target: /run/authorizer-credential, read_only: true}
      - type: bind
        source: "${AEGIS_SCANNER_REGISTRY_ROOT}"
        target: "${AEGIS_SCANNER_REGISTRY_ROOT}"
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${AEGIS_SCANNER_AUTHORIZER_ROOT}"
        target: "${AEGIS_SCANNER_AUTHORIZER_ROOT}"
        bind: {create_host_path: false}
    logging: {driver: none}
volumes:
  scanner_admission_credentials:
    external: true
    name: "${AEGIS_SCANNER_ADMISSION_CREDENTIAL_VOLUME:?Provision a separate private authorizer credential volume}"
